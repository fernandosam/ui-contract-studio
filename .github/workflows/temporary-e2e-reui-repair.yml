name: Temporary focused E2E repair validation
on:
  push:
    branches:
      - fix/e2e-reui-full-suite-20261026
permissions:
  contents: read
jobs:
  reui-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
      - uses: ./.github/actions/setup-chromium
      - name: Check TypeScript and build
        run: npm run build
      - name: Run repaired scenarios in both browser profiles
        run: |
          npx playwright test tests/e2e/diagnostic-reui-deep-link.spec.ts tests/e2e/reui-review-176.spec.ts tests/e2e/reui-semantic-admission.spec.ts tests/e2e/reui-family-functional.spec.ts --grep "deep link|ReUI slider|explorador separa|matriz de admissão|Slider: teclado" --workers=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-reui-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
