name: UI Contract Studio quality
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline invariants
        run: npm run docs:check && npm run test:offline && npm run composites:generated:check && npm run contracts:check && npm run patterns:check && npm run integration:check
      - name: Compare contracts with PR base
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-contract-diff.mjs
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require reviewed npm lockfile before restore
        run: |
          test -f package-lock.json || (echo 'Lockfile missing: generate it locally with npm + shadcn CLI, review and commit; CI must fail closed.' && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Export authoritative schemas for Pi
        run: npm run pi:zod-schema
      - name: Verify checkout provenance and primitives
        run: npm run doctor:strict
      - run: npm run shadcn:verify && npm run shadcn:integrity -- --strict
      - run: npm run validate && npm run build
      - name: Dry-run complete experimental artifact publication on PR
        run: npm run admission:publish
      - name: Validate Pi generator negative and positive cases
        run: npm run pi:validate -- --file=pi-catalog/examples/Dashboard01.json --out=reports/pi-validation/ci.json

  admission-browser:
    name: Admission browser review (not full E2E)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Set up browser for focused tests
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser" ]; then
            echo "UI_CONTRACT_STUDIO_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
            "$browser" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run admission:evidence:reset
      - name: Exercise TypedConfirmationDialog official experimental contract on desktop/mobile
        run: npm run test:composition:pilot
      - name: Exercise all three additional experimental contracts on desktop/mobile
        run: npm run test:admission:candidates
      - name: Verify opt-in official Pi catalog on desktop and mobile
        run: npx playwright test tests/e2e/admission-catalog.spec.ts --project=desktop --project=mobile
      - name: Verify evidence reports for all four candidates
        run: npm run admission:evidence:report
      - name: Save isolated proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-browser-evidence
          path: |
            reports/composition-validation/typed-confirmation/
            reports/composition-validation/admission/
            test-results/
          if-no-files-found: warn
