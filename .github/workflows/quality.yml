name: UI Contract Studio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The GITHUB_TOKEN that creates a T36 draft PR does not trigger pull_request.
  # A trusted workflow_dispatch on its exact branch produces the same required checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify browser impact (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes (fail closed)
        id: impact
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-change-impact.mjs

  offline-policy:
    name: Source, docs and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard mandatory semantic audit policy (blocking)
        run: npm run semantic:enforcement
      # Always runs, including when src/ui-catalog/knowledge/** changes.
      # semantic:check includes the Zod/Pi conformance audit; no separate workflow.
      - name: Validate semantic evidence and contract conformance (blocking)
        id: semantic-check
        shell: bash
        run: |
          mkdir -p reports/composition-analysis
          npm run semantic:check 2>&1 | tee reports/composition-analysis/semantic-check.log
      # Run after a failed check too: the CLI writes an explicitly invalid
      # diagnostic JSON and still exits nonzero for missing/invalid evidence.
      - name: Generate semantic coverage and freshness report
        id: semantic-report
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        shell: bash
        run: |
          npm run semantic:report 2>&1 | tee reports/composition-analysis/semantic-report.log
      - name: Summarize semantic diagnostics
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        run: node scripts/semantic-ci-summary.mjs
      - name: Preserve semantic report and failure logs
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: semantic-knowledge-report
          path: |
            reports/composition-analysis/semantic-knowledge.json
            reports/composition-analysis/semantic-check.log
            reports/composition-analysis/semantic-report.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify docs and offline invariants
        run: npm run docs:check && npm run test:offline
      - name: Check reviewed API changes against PR base
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run contracts:diff

  integration:
    name: Source checks, schemas and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - name: Export authoritative schemas for Pi
        run: npm run pi:zod-schema
      - name: Verify source provenance and upstream primitives
        run: npm run doctor:strict && npm run shadcn:verify && npm run shadcn:integrity -- --strict
      - name: Verify generators, contracts and boundaries
        run: npm run check
      - name: Lint sources
        run: npm run lint
      - name: Run integration tests (offline tests run in their own job)
        run: npx tsx --test tests/*.integration.test.ts
      - name: Typecheck and production build
        run: npm run build
      - name: Verify experimental distribution artifacts
        run: npm run admission:publish
      - name: Verify actual Pi spec validation
        run: npm run pi:validate -- --file=pi-catalog/examples/Dashboard01.json --out=reports/pi-validation/ci.json

  admission-browser:
    name: Focused admission browser review (PR only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: ./.github/actions/setup-chromium
      - name: Clear evidence from earlier runs
        run: npm run admission:evidence:reset
      - name: Prepare fingerprint manifest for actual browser tests
        run: npm run requirements:browser:prepare
      - name: Verify admission compositions and requirements wizard on desktop/mobile
        run: |
          npx playwright test \
            tests/e2e/typed-confirmation-pilot.spec.ts \
            tests/e2e/admission-candidates.spec.ts \
            tests/e2e/admission-catalog.spec.ts \
            tests/e2e/semantic-risk-t29.spec.ts \
            tests/e2e/alert-dialog-semantic-t32.spec.ts \
            tests/e2e/button-accordion-semantic-t32.spec.ts \
            tests/e2e/requirements-wizard.spec.ts \
            tests/e2e/requirements-flow.spec.ts \
            tests/e2e/requirements-patterns.spec.ts \
            tests/e2e/requirements-coverage-evidence.spec.ts \
            tests/e2e/requirements-intent.spec.ts \
            tests/e2e/declarative-form-pi.spec.ts \
            tests/e2e/submission-controlled-http.spec.ts \
            tests/e2e/declarative-form-certification.spec.ts \
            tests/e2e/t35-form-scenarios.spec.ts \
            --project=desktop --project=mobile
      - name: Verify T34 requirement-to-browser evidence (fail closed)
        run: npm run requirements:browser:report
      - name: Check all five fingerprint-bound browser evidence reports
        run: npm run admission:evidence:report
      - name: Preserve browser evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-browser-evidence
          path: |
            reports/composition-validation/
            reports/requirements-browser/
            reports/semantic-e2e/
            test-results/
          if-no-files-found: warn
          retention-days: 14
