name: UI Contract Studio quality

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify browser impact (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes (fail closed)
        id: impact
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-change-impact.mjs

  offline-policy:
    name: Source, docs and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit committed secrets and CI artifact retention (blocking)
        run: npm run security:check
      - name: Guard mandatory semantic audit policy (blocking)
        run: npm run semantic:enforcement
      # Always runs, including when src/ui-catalog/knowledge/** changes.
      # semantic:check includes the Zod/Pi conformance audit; no separate workflow.
      - name: Validate semantic evidence and contract conformance (blocking)
        id: semantic-check
        shell: bash
        run: |
          mkdir -p reports/composition-analysis
          npm run semantic:check 2>&1 | tee reports/composition-analysis/semantic-check.log
      # Run after a failed check too: the CLI writes an explicitly invalid
      # diagnostic JSON and still exits nonzero for missing/invalid evidence.
      - name: Generate semantic coverage and freshness report
        id: semantic-report
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        shell: bash
        run: |
          npm run semantic:report 2>&1 | tee reports/composition-analysis/semantic-report.log
      - name: Generate checked E05 cross-origin layout reuse evidence
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        run: npm run patterns:reuse:report
      - name: Compare E05 recurring structures with approved primitives and compositions
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        run: npm run patterns:reuse:compare:report
      - name: Summarize semantic diagnostics
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        run: node scripts/semantic-ci-summary.mjs
      - name: Preserve semantic report and failure logs
        if: ${{ !cancelled() && steps.semantic-check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantic-knowledge-report
          path: |
            reports/composition-analysis/semantic-knowledge.json
            reports/layout-reuse/evidence.json
            reports/layout-reuse/comparison.json
            reports/composition-analysis/semantic-check.log
            reports/composition-analysis/semantic-report.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify immutable theme versions against PR base (blocking)
        env:
          THEME_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run themes:check
      - name: Verify docs and offline invariants
        run: npm run docs:check && npm run test:offline
      - name: Check reviewed API changes against PR base
        id: contract-diff
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run contracts:diff
      - name: Generate JSON screen, example, composition and Pi impact report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.contract-diff.outcome != 'skipped' }}
        run: npm run contracts:impact
      - name: Preserve detailed contract change audit, including blocked changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.contract-diff.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: contract-change-audit
          path: |
            reports/contract-diff/changes.json
            reports/contract-diff/impact.json
            reports/contract-diff/impact.md
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Source checks, schemas and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - name: Audit npm production high+ and all-dependency critical+ advisories (blocking)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Export authoritative schemas for Pi
        run: npm run pi:zod-schema
      - name: Verify source provenance and upstream primitives
        run: npm run doctor:strict && npm run shadcn:verify && npm run shadcn:integrity -- --strict
      - name: Verify generators, contracts and boundaries
        run: npm run check
      - name: Exercise fingerprint-bound legacy migration with real Zod validation
        run: npm run contracts:migrate -- --file=tests/fixtures/contract-migrations/legacy-reui-spec.json --versions=tests/fixtures/contract-migrations/legacy-reui-versions.json --out=reports/contract-migrations/reui-migrated.json
      - name: Lint sources
        run: npm run lint
      - name: E12 contract, compatibility, security and in-process end-to-end tests (blocking)
        run: npm run test:e12
      - name: Run integration tests (offline tests run in their own job)
        run: npx tsx --test tests/*.integration.test.ts
      - name: Typecheck and production build
        run: npm run build
      # Required status: a local-only admission is NEVER accepted on semantic
      # documentation or a generated fixture alone. Prove it in a real browser.
      - uses: ./.github/actions/setup-chromium
      - name: Reset browser evidence for CI-admitted local forms
        run: npm run admission:evidence:reset
      - name: Exercise admission protocol and semantic recipes on desktop/mobile (blocking)
        run: |
          npx playwright test tests/e2e/declarative-form-certification.spec.ts tests/e2e/semantic-derived.spec.ts --project=desktop --project=mobile
      - name: Verify fingerprint-bound live browser evidence before admission (blocking)
        run: |
          node scripts/admission-evidence.mjs --report --candidate=form-declarative
          node scripts/admission-engine.mjs --ci-verify
      - name: Preserve admission proof for audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-local-admission-proof
          path: |
            reports/composition-validation/admission/form-declarative/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify experimental distribution artifacts
        run: npm run admission:publish
      - name: Verify actual Pi spec validation
        run: npm run pi:validate -- --file=pi-catalog/examples/Dashboard01.json --out=reports/pi-validation/ci.json

  admission-browser:
    name: Focused admission browser review (PR only)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: ./.github/actions/setup-chromium
      - name: Clear evidence from earlier runs
        run: npm run admission:evidence:reset
      - name: Prepare fingerprint manifest for actual browser tests
        run: npm run requirements:browser:prepare
      - name: Verify admission compositions and requirements wizard on desktop/mobile
        run: |
          npx playwright test \
            tests/e2e/typed-confirmation-pilot.spec.ts \
            tests/e2e/admission-candidates.spec.ts \
            tests/e2e/admission-catalog.spec.ts \
            tests/e2e/semantic-risk-t29.spec.ts \
            tests/e2e/alert-dialog-semantic-t32.spec.ts \
            tests/e2e/button-accordion-semantic-t32.spec.ts \
            tests/e2e/requirements-wizard.spec.ts \
            tests/e2e/layout-runtime-quality.spec.ts \
            tests/e2e/requirements-flow.spec.ts \
            tests/e2e/requirements-patterns.spec.ts \
            tests/e2e/requirements-coverage-evidence.spec.ts \
            tests/e2e/requirements-intent.spec.ts \
            tests/e2e/declarative-form-pi.spec.ts \
            tests/e2e/submission-controlled-http.spec.ts \
            tests/e2e/declarative-form-certification.spec.ts \
            tests/e2e/t35-form-scenarios.spec.ts \
            tests/e2e/preview-themes.spec.ts \
            --project=desktop --project=mobile
      - name: Verify T34 requirement-to-browser evidence (fail closed)
        run: npm run requirements:browser:report
      - name: Check all five fingerprint-bound browser evidence reports
        run: npm run admission:evidence:report
      - name: Preserve browser evidence for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admission-browser-evidence
          path: |
            reports/composition-validation/
            reports/requirements-browser/
            reports/layout-runtime/
            reports/semantic-e2e/
            reports/semantic-tests/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  auto-merge:
    name: Request native safe squash auto-merge (PR only)
    # Never check out untrusted PR code in a write-scoped job. Fork PRs are
    # not auto-enrolled. GitHub still enforces the protected-main checks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read trusted auto-merge policy from PR base, never PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Activate native auto-merge for ordinary non-draft PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail
          # Bootstrap: on the initial installation PR, the trusted base
          # does not contain the policy yet. Never execute the PR copy instead.
          if [[ ! -f scripts/ci-auto-merge-policy.mjs ]]; then
            echo "Auto-merge policy absent on trusted base; manual bootstrap merge required"
            exit 0
          fi
          # Fetch ALL files, including rename origins, not a truncated first page.
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/auto-merge-pr-files.json"
          decision="$(node scripts/ci-auto-merge-policy.mjs "$RUNNER_TEMP/auto-merge-pr-files.json")"
          existing="$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$PR_IS_DRAFT" == "true" || "$decision" == "review-required" ]]; then
            if [[ "$existing" == "true" ]]; then
              gh pr merge "$PR_NUMBER" --disable-auto
              echo "Disabled existing auto-merge: draft or sensitive PR"
            else
              echo "Auto-merge not enabled: draft or sensitive PR"
            fi
            exit 0
          fi
          test "$decision" = "eligible" || {
            echo "::error::Auto-merge eligibility is not a recognized safe decision"
            exit 1
          }
          current_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          test "$current_sha" = "$PR_HEAD_SHA" || {
            echo "::error::PR head changed while evaluating; wait for its synchronize event"
            exit 1
          }
          if [[ "$existing" == "true" ]]; then
            echo "Native auto-merge already enabled for this PR"
            exit 0
          fi
          # --auto obeys branch protections; --match-head-commit prevents a
          # stale event from enabling it on a different revision. No --admin.
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
          echo "Native squash auto-merge enabled; required main checks still gate merging"
