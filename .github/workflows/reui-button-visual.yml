name: ReUI Button focused visual tests
on:
  push:
    branches:
      - feat/reui-button-61-previews-20261023
    paths:
      - .github/workflows/reui-button-visual.yml
      - tests/e2e/reui-button-61.spec.ts
      - src/ui-catalog/extensions/composites/reui-button-*.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  button-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/reui-button-61.spec.ts --project=desktop --project=mobile
      - name: Save button screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reui-button-previews
          path: |
            reports/reui-button-visual/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
