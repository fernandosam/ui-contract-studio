name: Pi generation evaluation (real runs)
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Configured Pi model (blank uses Pi default)'
        required: true
        type: string
      repair:
        description: 'Executar uma tentativa EXTRA de reparo com custo adicional'
        type: boolean
        required: false
        default: false
permissions:
  contents: read

concurrency:
  group: pi-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-pi-evaluation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: npm run pi:zod-schema
      - name: Install pinned maintained Pi CLI (no lifecycle scripts)
        run: |
          npm install -g --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          pi --version
      - name: Run 20 prompts with actual Pi model
        env:
          PI_EVAL_CONFIRM: 'yes'
          PI_EVAL_MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ secrets.PI_EVAL_API_KEY }}
          PI_EVAL_REPAIR: ${{ inputs.repair }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
          PI_SKIP_VERSION_CHECK: '1'
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then echo "::error::PI_EVAL_API_KEY is not configured"; exit 1; fi
          npm run eval:pi:context
          if [ "$PI_EVAL_REPAIR" = "true" ]; then
            PI_EVAL_REPAIR_CONFIRM=yes npm run eval:pi:run -- --execute --repair
          else
            npm run eval:pi:run -- --execute
          fi
      - name: Strict validation and metrics (never skip missing results)
        run: npm run eval:pi:strict
      - name: Delete raw generated specs and per-scenario error details
        if: always()
        run: rm -rf eval-results/ reports/pi-eval/runs/
      - name: Attach sanitized aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-evaluation-metrics
          path: |
            reports/pi-evaluation.json
            reports/pi-evaluation.md
          if-no-files-found: warn
          retention-days: 7
