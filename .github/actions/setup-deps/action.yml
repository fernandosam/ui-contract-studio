name: Setup Node and locked dependencies
description: Install Node.js 22 and immutable npm dependencies using the npm download cache
runs:
  using: composite
  steps:
    - name: Require reviewed package lock
      shell: bash
      run: test -f package-lock.json || { echo "::error::package-lock.json is required"; exit 1; }
    - name: Set up Node.js and npm cache
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install exactly locked dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
